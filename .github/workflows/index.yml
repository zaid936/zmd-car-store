name: Update store list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [notes.json]

# One run at a time; a newer request waits for the current one instead of racing it.
concurrency:
  group: store-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-index.txt
      - run: pip install --quiet -r .github/requirements-index.txt
      # Build and save. If index.json changed on GitHub meanwhile (an app was just added by the
      # upload page), start again from the newest version so nothing is lost.
      - name: Build and save the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "zmd-store-bot"
          git config user.email "zmd-store-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python .github/scripts/build_index.py
            if git diff --quiet index.json; then echo "nothing to save"; exit 0; fi
            git add index.json && git commit -qm "Update store index"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "index.json changed meanwhile, building again"; sleep 2
          done
          exit 1
